<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio — AI, Dizayn va Avtomatlashtirish</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        colors: {
          ink: {
            950: '#06070d',
            900: '#0a0c16',
            800: '#11142233',
            700: '#1a1e30',
          },
          neon: {
            blue: '#3b82ff',
            violet: '#8b5cf6',
            cyan: '#22d3ee',
          }
        },
        animation: {
          'aurora': 'aurora 18s ease-in-out infinite',
          'float': 'float 9s ease-in-out infinite',
          'float-slow': 'float 14s ease-in-out infinite',
          'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
          'spin-slow': 'spin 24s linear infinite',
          'marquee': 'marquee 40s linear infinite',
          'fade-up': 'fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both',
        }
      }
    }
  }
</script>

<style>
  :root {
    --bg: #06070d;
    --bg-2: #0a0c16;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: #e6e8ef;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: rgba(139,92,246,.45); color: #fff; }

  /* Aurora animated background */
  @keyframes aurora {
    0%, 100% { transform: translate3d(-8%, -4%, 0) scale(1); opacity: .55; }
    33%      { transform: translate3d(10%, 6%, 0)  scale(1.15); opacity: .75; }
    66%      { transform: translate3d(-4%, 10%, 0) scale(1.05); opacity: .6; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(1.2deg); }
  }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 0 0 0 rgba(59,130,255,.45), 0 0 60px rgba(139,92,246,.25); }
    50%     { box-shadow: 0 0 0 12px rgba(59,130,255,0), 0 0 90px rgba(34,211,238,.35); }
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .grid-bg {
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 75%);
  }

  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
  }
  .glass-hover {
    transition: transform .5s cubic-bezier(.2,.8,.2,1), border-color .4s, background .4s, box-shadow .5s;
  }
  .glass-hover:hover {
    transform: translateY(-4px);
    border-color: var(--line-2);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    box-shadow: 0 20px 60px -20px rgba(59,130,255,.35), 0 0 0 1px rgba(139,92,246,.18) inset;
  }

  .text-gradient {
    background: linear-gradient(120deg, #ffffff 0%, #cdd5ff 35%, #b6f0ff 60%, #d9c6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .text-gradient-accent {
    background: linear-gradient(100deg, #22d3ee 0%, #3b82ff 50%, #8b5cf6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .btn-primary {
    position: relative;
    background: linear-gradient(100deg, #3b82ff 0%, #8b5cf6 60%, #22d3ee 120%);
    color: white;
    box-shadow: 0 10px 30px -10px rgba(59,130,255,.7), 0 0 0 1px rgba(255,255,255,0.08) inset;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s, filter .4s;
  }
  .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 18px 50px -12px rgba(139,92,246,.7); }

  .btn-ghost {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    color: #e6e8ef;
    transition: all .35s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.07); border-color: var(--line-2); transform: translateY(-2px); }

  .ring-grad {
    position: relative;
  }
  .ring-grad::before {
    content: "";
    position: absolute; inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(140deg, rgba(59,130,255,.55), rgba(139,92,246,.45) 40%, rgba(34,211,238,.5) 80%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: .9;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  }

  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1); }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* Subtle shimmer for placeholder image stripes */
  .stripe-ph {
    background:
      repeating-linear-gradient(135deg,
        rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 8px,
        rgba(255,255,255,0.015) 8px, rgba(255,255,255,0.015) 16px);
  }

  .nav-link { position: relative; }
  .nav-link::after {
    content: ""; position: absolute; left: 0; right: 100%; bottom: -6px; height: 1px;
    background: linear-gradient(90deg, #22d3ee, #8b5cf6);
    transition: right .35s ease;
  }
  .nav-link:hover::after { right: 0; }

  /* Hero visual orbs */
  .orb {
    position: absolute; border-radius: 9999px; filter: blur(48px); opacity: .6;
    will-change: transform;
  }
</style>
</head>
<body class="relative">

<!-- ANIMATED BACKDROP -->
<div aria-hidden="true" class="fixed inset-0 -z-10 pointer-events-none">
  <div class="absolute inset-0" style="background: radial-gradient(1200px 700px at 80% -10%, rgba(59,130,255,.18), transparent 60%), radial-gradient(900px 600px at 0% 20%, rgba(139,92,246,.16), transparent 60%), radial-gradient(800px 600px at 50% 110%, rgba(34,211,238,.12), transparent 60%), #06070d;"></div>
  <div class="absolute inset-0 grid-bg opacity-70"></div>
  <div class="orb animate-aurora" style="width: 520px; height: 520px; left: -120px; top: -80px; background: radial-gradient(circle, #3b82ff 0%, transparent 60%);"></div>
  <div class="orb animate-aurora" style="width: 620px; height: 620px; right: -160px; top: 10%; background: radial-gradient(circle, #8b5cf6 0%, transparent 60%); animation-delay: -6s;"></div>
  <div class="orb animate-aurora" style="width: 480px; height: 480px; left: 30%; bottom: -160px; background: radial-gradient(circle, #22d3ee 0%, transparent 60%); animation-delay: -10s;"></div>
</div>

<div id="root"></div>
